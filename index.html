<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-A-Water</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <img
      class="brand-logo"
      src="img/cw_logo.png"
      alt="charity: water"
    >

    <h1>Whack-A-Water</h1>

    <p class="game-instructions">
      Collect at least 20 blue water drops in 30 seconds.
      Avoid the red warning symbols—they subtract one point!
    </p>

    <div class="stats">
      <p>Score: <span id="score">0</span>/20</p>
      <p>Time: <span id="timer">30</span>s</p>
    </div>

    <p id="message" role="status" aria-live="polite">
      Press Start Game to begin.
    </p>

    <div class="game-grid" aria-label="Water drop game board"></div>

    <button id="start-game" class="start-button" type="button">
      Start Game
    </button>

    <button id="reset-game" class="reset-button" type="button">
      Reset Game
    </button>

    <footer>
      <p>Clean water changes lives.</p>
      <a href="https://www.charitywater.org/"
         target="_blank"
         rel="noopener noreferrer">
        Learn more about charity: water
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
